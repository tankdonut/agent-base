name: staging-seed

# One-shot: creates the ghcr.io/tankdonut/agent-base-staging package
# via a GITHUB_TOKEN push, which auto-links it to this repo (Actions
# access inherited). A scratch seed image keeps the upload tiny; the
# real Phase-2 candidate flow owns everything the package carries after
# this. Delete this workflow once the package exists.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to ghcr.io
        uses: tankdonut/github-actions/actions/ghcr-login@246ecbe1d54fe84165f0b9f7d8aae44a0e5fa373 # v1
        with:
          runtime: docker
          registry: ghcr.io

      - name: Push seed image
        run: |
          cat > /tmp/Dockerfile.seed <<'EOF'
          FROM scratch
          LABEL org.opencontainers.image.title="agent-base-staging seed"
          LABEL org.opencontainers.image.source="https://github.com/tankdonut/agent-base"
          EOF
          docker build -f /tmp/Dockerfile.seed -t ghcr.io/tankdonut/agent-base-staging:seed /tmp
          docker push ghcr.io/tankdonut/agent-base-staging:seed

      - name: Report package state
        run: |
          curl -sf -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/user/packages/container/agent-base-staging" \
            | jq '{name, visibility, version_count}'
