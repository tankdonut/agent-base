name: nightly

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC, after the daily image build window
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One nightly in flight: a stuck run must not stack behind itself.
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-e2e:
    # The whole matrix the PR gate slims away: upgrade path (warm
    # volume + dual tag), dev overlay, 2-agent fleet, shared-litellm
    # plane, and the full stage assertions.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: tankdonut/github-actions/actions/setup-python-uv@246ecbe1d54fe84165f0b9f7d8aae44a0e5fa373 # v1
        with:
          python-version: "3.11"
      - name: agentctl full front-door e2e (all stages)
        env:
          E2E_ENGINE: docker
        run: ./make.sh agentctl-e2e
      - name: Upload e2e forensics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-forensics
          path: logs/

  full-e2e-podman:
    # Same matrix on the local-first engine: the plane's service_healthy
    # gating and podman-compose's provider quirks are exactly what the
    # suite exists to catch.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: tankdonut/github-actions/actions/setup-python-uv@246ecbe1d54fe84165f0b9f7d8aae44a0e5fa373 # v1
        with:
          python-version: "3.11"
      - name: Install podman + compose provider
        run: |
          sudo apt-get update
          sudo apt-get install -y podman podman-compose
          # Rootless port publishing needs subordinate id ranges for the
          # runner user.
          sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 "$(id -un)"
          podman info --format "{{.Host.Arch}}" >/dev/null
          podman-compose version
      - name: agentctl full front-door e2e (all stages, podman)
        env:
          E2E_ENGINE: podman
        run: ./make.sh agentctl-e2e
      - name: Upload e2e forensics (podman)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-forensics-podman
          path: logs/

  published-image-watchdog:
    # Boots the newest PUBLISHED date tag and asserts release-identity:
    # baked AGENT_BASE_VERSION == tag (the upgrade-semantics anchor),
    # HEALTHCHECK present, gh CLI present, entrypoint runs. Catches a
    # broken promotion that the tagging run's own gates missed.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Resolve newest published release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list -L 100 --json tagName,isDraft,isPrerelease \
            --jq '[.[] | select(.isDraft | not) | select(.isPrerelease | not) | .tagName] | map(select(test("^[0-9]{4}\\.[0-9]{2}\\.[0-9]{2}"))) | .[0]')
          [ -n "$tag" ] || { echo "::error::no published date-tag release found"; exit 1; }
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
      - name: Boot + identity assertions
        run: |
          TAG="${{ steps.latest.outputs.tag }}"
          docker pull -q "ghcr.io/tankdonut/agent-base:$TAG" >/dev/null
          got=$(docker run --rm --entrypoint /bin/sh "ghcr.io/tankdonut/agent-base:$TAG" -c 'echo $AGENT_BASE_VERSION')
          [ "$got" = "$TAG" ] || { echo "::error::baked version '$got' != tag $TAG"; exit 1; }
          hc=$(docker inspect --format '{{json .Config.Healthcheck.Test}}' "ghcr.io/tankdonut/agent-base:$TAG")
          echo "$hc" | grep -q healthz || { echo "::error::HEALTHCHECK missing"; exit 1; }
          docker run --rm --entrypoint gh "ghcr.io/tankdonut/agent-base:$TAG" --version >/dev/null
          docker run --rm --entrypoint python3 "ghcr.io/tankdonut/agent-base:$TAG" -c 'import sys; sys.exit(0)'
          echo "watchdog: $TAG boots, identity + HEALTHCHECK + gh verified"
