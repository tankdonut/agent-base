name: CI

on:
  push:
    branches: [main]
    # v-less date tags (YYYY.MM.DD, or YYYY.MM.DD.N for a same-day
    # follow-up release) — tag name is AGENT_BASE_VERSION verbatim,
    # matching the pinned-image convention in docs/standard-agent.md.
    tags: ["20*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run pre-commit checks
        uses: tankdonut/github-actions/actions/pre-commit@246ecbe1d54fe84165f0b9f7d8aae44a0e5fa373 # v1

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11 = image floor (bookworm); 3.14 = host-current syntax-drift guard.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python + uv
        uses: tankdonut/github-actions/actions/setup-python-uv@246ecbe1d54fe84165f0b9f7d8aae44a0e5fa373 # v1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run container test suites
        run: python3 -m unittest discover -s container -v

  agentctl:
    # Go operator-CLI quality gate (module at repo root); mirrors the
    # local pre-commit go-fmt/go-vet hooks and gates the release chain
    # via the image-* jobs' needs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Check formatting (gofmt)
        run: test -z "$(gofmt -l cmd internal)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  contract:
    needs: [lint, test]
    # Real-image CLI drift gate (roadmap N4): unit tests and the shim-based
    # smoke both validate agent-base's argv against itself — this job boots
    # the built image against the REAL openclaw CLI. Stage B cross-checks
    # every emitted flag against `openclaw <cmd> --help`; stage C requires a
    # clean real boot (exit 0, zero [agent-entry] WARNING) with both canary
    # MCP servers registered. This is what stops the next --type-remote-class
    # bug (including via renovate base-image bumps, whose PRs run CI).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image (build-only; the image job owns publishing)
        run: docker build --build-arg AGENT_BASE_VERSION=contract
          -f container/Dockerfile -t ghcr.io/tankdonut/agent-base:contract .

      - name: CLI contract test (real OpenClaw CLI, no shim)
        # CONTRACT_ENGINE: the image above was built with docker; the
        # script's podman-first auto-detect would look in podman's store,
        # miss it, and try pulling :contract from GHCR.
        env:
          CONTRACT_ENGINE: docker
        run: scripts/contract-test.sh ghcr.io/tankdonut/agent-base:contract

  smoke:
    needs: [lint, test]
    # Image smoke gate (formerly local-only): the contract job proves
    # emitted argv against the real CLI, but only this job proves the
    # boot PHASE ORDER (shim invocation log), gh presence, HEALTHCHECK
    # presence — and the graceful-shutdown drain: engine `stop` must exit
    # 0 only after the gateway's in-flight automation child finished
    # (container/entrypoint.py supervise). SMOKE_ENGINE pins docker for
    # the same reason CONTRACT_ENGINE does: GH runners preinstall podman
    # and the script's podman-first auto-detect would build into a
    # different image store.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Image smoke (fixtures + graceful-shutdown drain)
        env:
          SMOKE_ENGINE: docker
        run: ./make.sh smoke

  # Multi-arch image (L1): native per-arch builds keep the docker media
  # type (a single buildx multi-platform push exports OCI and silently
  # drops the Dockerfile HEALTHCHECK — the trap X3 documented), then
  # imagetools assembles the index. This replaces the reusable
  # build-and-publish call: the shared workflow hardcodes ubuntu-latest
  # and cannot express per-arch runners; the ghcr-login composite action
  # is still composed below.
  image-amd64:
    needs: [agentctl, lint, test, contract, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/tankdonut/agent-base
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: tankdonut/github-actions/actions/ghcr-login@246ecbe1d54fe84165f0b9f7d8aae44a0e5fa373 # v1
        with:
          runtime: docker
          registry: ghcr.io
      - name: Build (and push arch tag on releases)
        # pull_request refs are "N/merge" and the slash is invalid in a
        # docker tag — sanitize before tagging (no-op on branch/tag refs).
        run: |
          TAG="${GITHUB_REF_NAME//\//-}"
          docker build --platform linux/amd64 -f container/Dockerfile \
            --build-arg AGENT_BASE_VERSION="${GITHUB_REF_NAME:-dev}" \
            -t "$IMAGE:${TAG}-amd64" .
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then docker push "$IMAGE:${TAG}-amd64"; fi

  image-arm64:
    needs: [agentctl, lint, test, contract, smoke]
    # Free native arm64 runners are available to public repos.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/tankdonut/agent-base
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: tankdonut/github-actions/actions/ghcr-login@246ecbe1d54fe84165f0b9f7d8aae44a0e5fa373 # v1
        with:
          runtime: docker
          registry: ghcr.io
      - name: Build (and push arch tag on releases)
        # pull_request refs are "N/merge" and the slash is invalid in a
        # docker tag — sanitize before tagging (no-op on branch/tag refs).
        run: |
          TAG="${GITHUB_REF_NAME//\//-}"
          docker build --platform linux/arm64 -f container/Dockerfile \
            --build-arg AGENT_BASE_VERSION="${GITHUB_REF_NAME:-dev}" \
            -t "$IMAGE:${TAG}-arm64" .
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then docker push "$IMAGE:${TAG}-arm64"; fi

  image:
    # Manifest merge: assembles the multi-arch index from the per-arch
    # tags. Digest-level result is what attest signs and consumers pull.
    needs: [image-amd64, image-arm64]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: tankdonut/github-actions/actions/ghcr-login@246ecbe1d54fe84165f0b9f7d8aae44a0e5fa373 # v1
        with:
          runtime: docker
          registry: ghcr.io
      - name: Assemble multi-arch manifest
        run: |
          docker buildx imagetools create -t ghcr.io/tankdonut/agent-base:"$GITHUB_REF_NAME" \
            ghcr.io/tankdonut/agent-base:"$GITHUB_REF_NAME-amd64" \
            ghcr.io/tankdonut/agent-base:"$GITHUB_REF_NAME-arm64"
      - name: Verify merged manifest carries the HEALTHCHECK
        run: |
          token=$(curl -sf "https://ghcr.io/token?scope=repository:tankdonut/agent-base:pull&service=ghcr.io" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          index=$(curl -sf -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://ghcr.io/v2/tankdonut/agent-base/manifests/$GITHUB_REF_NAME")
          echo "$index" | jq -e '.manifests | length == 2' >/dev/null
          for arch in amd64 arm64; do
            digest=$(echo "$index" | jq -r ".manifests[] | select(.platform.architecture == \"$arch\") | .digest")
            config=$(curl -sf -H "Authorization: Bearer $token" \
              -H "Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
              "https://ghcr.io/v2/tankdonut/agent-base/manifests/$digest" | jq -r .config.digest)
            curl -sfL -H "Authorization: Bearer $token" \
              "https://ghcr.io/v2/tankdonut/agent-base/blobs/$config" \
              | jq -e '.config.Healthcheck.Test[0] == "CMD"' >/dev/null \
              || { echo "::error::$arch manifest lost the HEALTHCHECK"; exit 1; }
            echo "$arch: HEALTHCHECK present"
          done

  attest:
    # Supply chain (X5): SLSA build-provenance attestation pushed to the
    # registry + SPDX SBOM handed to the release as an asset. The caller
    # attests (not the reusable workflow) so the signer is this repo —
    # verification needs no --signer-repo. Tag pushes only.
    needs: [image]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      packages: write
      contents: read
    steps:
      - name: Resolve published digest
        id: digest
        run: |
          TOKEN=$(curl -sf "https://ghcr.io/token?scope=repository:tankdonut/agent-base:pull&service=ghcr.io" \
            | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          DIGEST=$(curl -sI \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://ghcr.io/v2/tankdonut/agent-base/manifests/$GITHUB_REF_NAME" \
            | tr -d '\r' | sed -n 's/^docker-content-digest:[[:space:]]*//Ip' | head -1)
          if [ -z "$DIGEST" ]; then
            echo "::error::no digest for $GITHUB_REF_NAME in ghcr.io (image job failed?)"
            exit 1
          fi
          echo "digest=$DIGEST" >>"$GITHUB_OUTPUT"

      - name: Login to ghcr.io
        # actions/attest reads registry credentials from the docker config
        # — without an in-job login it cannot push the attestation
        # manifest (first live run failed exactly there).
        uses: tankdonut/github-actions/actions/ghcr-login@246ecbe1d54fe84165f0b9f7d8aae44a0e5fa373 # v1
        with:
          runtime: docker
          registry: ghcr.io

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/tankdonut/agent-base
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

  release:
    # Chained after the image job — a release can no longer exist while the
    # image 404s (the standalone release.yml raced the image publish on tag
    # pushes; both fired with no ordering). Tag pushes only.
    needs: [image, attest]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history: the release notes diff the two most recent version
      # tags, and the digest query needs the published manifest.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify tracked image refs exist in GHCR
        run: scripts/check-image-refs.sh

      - name: Build release notes (changes + digest)
        run: |
          TAG="$GITHUB_REF_NAME"
          BASE_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          PREV=$(git tag -l '20*' | sort -V | awk -v t="$TAG" '$0==t{print p} {p=$0}')
          TOKEN=$(curl -sf "https://ghcr.io/token?scope=repository:tankdonut/agent-base:pull&service=ghcr.io" |
            sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          DIGEST=$(curl -sI -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json" \
            "https://ghcr.io/v2/tankdonut/agent-base/manifests/$TAG" |
            tr -d '\r' | sed -n 's/^docker-content-digest:[[:space:]]*//Ip')
          {
            echo "Image: \`ghcr.io/tankdonut/agent-base:$TAG\`"
            if [ -n "$DIGEST" ]; then
              echo
              echo "Digest \`$DIGEST\` — pin: \`ghcr.io/tankdonut/agent-base:$TAG@$DIGEST\`"
            fi
            echo
            echo "### Changes"
            echo
            if [ -n "$PREV" ]; then
              git log --format="- %s ([%h]($BASE_URL/commit/%H))" "$PREV..$TAG"
            else
              git log --format="- %s ([%h]($BASE_URL/commit/%H))" "$TAG"
            fi
            if [ -n "$DIGEST" ]; then
              echo
              echo "Verify provenance: \`gh attestation verify oci://ghcr.io/tankdonut/agent-base:$TAG@$DIGEST -R $GITHUB_REPOSITORY\`"
            fi
            echo
            echo "### agentctl"
            echo
            echo "Operator CLI for downstream agent projects — binaries: \`agentctl-linux-amd64\`, \`agentctl-linux-arm64\` (checksums: \`agentctl-SHA256SUMS\`)."
          } > release-notes.md
          cat release-notes.md

      - name: Generate SBOM (SPDX)
        # In the release job (not attest): no artifact handoff —
        # sbom-action's artifact-name/output-file semantics conflict, so
        # the file is written straight into this workspace and uploaded
        # as a release asset below. Scans the published tag from the
        # registry.
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ghcr.io/tankdonut/agent-base:${{ github.ref_name }}
          format: spdx-json
          output-file: sbom.spdx.json

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Build agentctl release binaries
        # Pure Go — cross-compiles from one runner for both image
        # architectures. The version check enforces the pre-tag bump
        # convention: agentctl's date-versioned constant must equal the
        # tag being released, or the constants drifted and the release
        # must fix-forward with a .N suffix.
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags "-s -w" \
              -o "dist/agentctl-linux-$arch" ./cmd/agentctl
          done
          (cd dist && sha256sum agentctl-linux-* > agentctl-SHA256SUMS)
          v=$(./dist/agentctl-linux-amd64 version | awk '{print $2}')
          if [ "$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::agentctl version $v != tag $GITHUB_REF_NAME — bump internal/cli Version and scaffold DefaultBaseTag on main, then cut the next .N"
            exit 1
          fi
          grep -Eq "DefaultBaseTag[[:space:]]+=[[:space:]]+\"$GITHUB_REF_NAME\"" internal/scaffold/config.go \
            || { echo "::error::scaffold DefaultBaseTag != $GITHUB_REF_NAME — bump it with the internal/cli Version on main, then cut the next .N"; exit 1; }

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          # No clone needed for gh; the repo comes from GH_REPO (gh would
          # otherwise shell out to git and fail without a remote).
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            sbom.spdx.json \
            dist/agentctl-linux-amd64 dist/agentctl-linux-arm64 \
            dist/agentctl-SHA256SUMS
