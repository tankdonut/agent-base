# Production agent service: a COMPLETE compose file skeleton, not a snippet.
#
# Expects a thin project Dockerfile at the repo root (docs/standard-agent.md
# Quick start): FROM ghcr.io/tankdonut/agent-base:<date-tag> pinned by exact
# tag (or tag@sha256:… digest; Renovate pinDigests keeps it current) plus
# COPY lines for spec.json, seed content, and automations.
#
# The hardening below is ACTIVE, not commented out: named volumes cover
# every writable path the base needs ({data} at /home/node/.openclaw, plus
# /backups), so the container root filesystem stays immutable.
# docs/deployment.md carries the full playbook this file summarizes (host
# prep, reverse proxy, update/rollback, unhealthy-watchdog).
#
# Rootless Podman: if SELinux MCS denials hit the named volumes, add
# `label=disable` under security_opt (rationale in compose.agent.yml).

# Pinned compose project name: namespaces every generated resource
# (containers, volumes, the agent-net network) so the stack is immune to
# directory renames and cannot collide with another agent on the same
# host. Set one <project> per agent host-wide; real volume names become
# <project>_agent-data / <project>_agent-backups.
name: <project>

services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Graceful shutdown: the engine must not SIGKILL PID 1 mid-drain, so
    # the stop timeout stays above AGENT_SHUTDOWN_GRACE (600s default —
    # the entrypoint force-kills the gateway group itself at the grace
    # limit; a second stop signal also force-kills immediately).
    stop_grace_period: 11m
    env_file:
      - .env
    # Two networks: agent-net stays dedicated to the gateway port (a
    # bearer-auth-only surface — no unrelated sibling shares its L2; a
    # host-process reverse proxy reaches it via the 127.0.0.1 bind below).
    # model-net carries exactly the agent and its LiteLLM proxy: the proxy
    # CAN reach the gateway over it — accepted, the gateway is token-gated
    # on every interface; the pairing is what keeps every other sibling
    # off the gateway L2.
    networks:
      - agent-net
      - model-net
    # Boot ordering only (service_started): the gateway serves healthz
    # before the proxy settles; a broken proxy surfaces as model-call
    # errors + its own healthcheck, not as a dead agent.
    depends_on:
      - litellm
    volumes:
      - agent-data:/home/node/.openclaw
      # Upgrade backups land here: a verified archive is written before any
      # image-version delta mutates a warm volume. Without this volume the
      # archives vanish with the container.
      - agent-backups:/backups
    # Loopback-only bind; remote access goes through a TLS-terminating
    # reverse proxy (docs/deployment.md). AGENT_GATEWAY_PORT is host-side
    # compose interpolation (examples/env.example section 4), and never
    # enters the container.
    ports:
      - "127.0.0.1:${AGENT_GATEWAY_PORT:-18789}:18789"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:18789/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      # First boot runs setup + reconcile + seed before the gateway
      # starts; upgrade boots add a verified backup. Match the image
      # HEALTHCHECK.
      start_period: 300s
    # Hardening baseline (docs/standard-agent.md "Deployment hardening").
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
    # Resource ceiling. OOM kill exits tini, which trips restart:
    # unless-stopped. Keep the sum of all service limits below host RAM;
    # the pids limit blunts fork runaway from agent-spawned processes.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
          pids: 512
    # Rotate container logs host-side; json-file keeps `docker logs --follow`
    # working. Values are strings, not numbers.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Model/provider home: EVERY provider API key lives only in the litellm
  # service env (env_file below — same litellm/.env shape agentctl
  # scaffolds; golden contents in examples/litellm/config.example.yaml's
  # sibling env example) — the agent container never sees them and holds
  # only the proxy key (LITELLM_API_KEY, mirrored from LITELLM_MASTER_KEY).
  # DB-less mode: the master key is the whole auth surface (no virtual
  # keys/budgets — those need a database). Version tag pinned; Renovate
  # bumps + digest-pins it.
  litellm:
    image: ghcr.io/berriai/litellm:v1.100.0@sha256:c8756e7b9a61fe45df2ccb5b781d388c3b2f3a21ef9e4956630caef20f9f03aa
    command: ["--config", "/app/proxy_server_config.yaml", "--port", "4000"]
    restart: unless-stopped
    env_file:
      - litellm/.env
    # Read-only config mount; the Z suffix relabels for rootless-podman
    # SELinux hosts (a no-op elsewhere). The proxy config carries no
    # secrets — keys arrive via env indirection (os.environ/NAME).
    volumes:
      - ./litellm/config.yaml:/app/proxy_server_config.yaml:ro,Z
    networks:
      - model-net
    # No published ports: the proxy is agent-reachable only (model-net),
    # never host-reachable.
    healthcheck:
      # The image ships no curl; its venv python3 serves the probe.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

networks:
  agent-net: {}
  model-net: {}

volumes:
  agent-data:
  agent-backups:
