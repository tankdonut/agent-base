# See https://pre-commit.com for more info
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-json

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint
        files: ^container/Dockerfile$

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2

  # agentctl (Go module at repo root): golangci-lint via the official
  # mirror — depguard layering (see .golangci.yml), govet, and gofmt
  # (--fix auto-formats). pre-commit builds the pinned binary itself;
  # a local Go toolchain is required.
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.13.2
    hooks:
      - id: golangci-lint
        args: [--fix]
        files: ^(cmd|internal)/
