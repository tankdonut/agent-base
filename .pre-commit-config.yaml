# See https://pre-commit.com for more info
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-json
      # Parses every tracked YAML — the compose examples, the litellm
      # golden config, and the workflow files themselves.
      - id: check-yaml

  # env.example ↔ spec.example.json drift gate: the golden pair must stay
  # in lockstep (container/test_spec.py EnvExampleContract). The spec
  # loader suite runs, so schema regressions trip the same hook.
  - repo: local
    hooks:
      - id: env-example-contract
        name: env-example contract (spec loader suite)
        entry: python3 -m unittest discover -s container -p test_spec.py
        language: system
        pass_filenames: false
        files: ^(examples/(env\.example|spec\.example\.json)|container/(spec|test_spec)\.py)$

  # Docs link/anchor gate: relative links must resolve and intra-doc anchors
  # must match headings (GitHub slug rules, offline; scripts/check-doc-links.py).
  # Full doc set on every trigger: anchors live across files.
  - repo: local
    hooks:
      - id: doc-links
        name: doc links/anchors (repo docs)
        entry: python3 scripts/check-doc-links.py
        language: system
        pass_filenames: false
        files: ^(README\.md|AGENTS\.md|container/AGENTS\.md|docs/.*\.md)$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint
        files: ^container/Dockerfile$

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2
